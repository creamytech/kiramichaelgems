<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>KM Gems</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Georgia,serif; background:#F8F7FA; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .card { background:#fff; border-radius:20px; padding:40px 32px; text-align:center; max-width:360px; width:100%; box-shadow:0 4px 24px rgba(80,30,120,0.1); }
    .icon { width:56px; height:56px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px; }
    .icon svg { width:28px; height:28px; }
    .green { background:#EAF6EF; }
    .gray { background:#F0ECF4; }
    h1 { font-size:22px; margin-bottom:4px; }
    p { font-size:15px; color:#555; margin-bottom:24px; }
    .btn { display:block; background:linear-gradient(135deg, #A040E0, #8B2FC9, #7025A8); color:#fff; text-decoration:none; padding:16px 24px; border-radius:12px; font-size:17px; font-weight:700; font-family:Georgia,serif; }
    .sub { font-size:12px; color:#888; margin-top:14px; }
  </style>
  <script>
    // Check if payment was successful from URL params
    var params = new URLSearchParams(window.location.search);
    var rawData = params.get("data");
    var paid = false;
    if (rawData) {
      try {
        var d = JSON.parse(rawData);
        if (d.status === "ok") paid = true;
      } catch(e) {}
    }
    // Also check for status param directly
    if (params.get("status") === "ok") paid = true;

    if (paid) {
      try { localStorage.setItem("km-square-paid", Date.now().toString()); } catch(e) {}
    }
  </script>
</head>
<body>
  <div class="card">
    <script>
      if (paid) {
        document.write('<div class="icon green"><svg viewBox="0 0 24 24" fill="none" stroke="#2D7D4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>');
        document.write('<h1 style="color:#2D7D4F">Payment Complete</h1>');
        document.write('<p>Go back to KM Gems to finish up</p>');
      } else {
        document.write('<div class="icon gray"><svg viewBox="0 0 24 24" fill="none" stroke="#8B2FC9" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="13"/><circle cx="12" cy="17" r="1" fill="#8B2FC9" stroke="none"/></svg></div>');
        document.write('<h1 style="color:#1A1A1A">Payment Cancelled</h1>');
        document.write('<p>No charge was made. Go back to try again.</p>');
      }
    </script>
    <div class="sub" style="font-size:15px;color:#1A1A1A;margin-bottom:8px;font-weight:600">Switch back to KM Gems on your home screen</div>
    <div class="sub" style="margin-top:0">Swipe up and tap the KM Gems app, or close this tab</div>
  </div>
</body>
</html>
