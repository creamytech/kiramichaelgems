<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Payment Complete — KM Gems</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:Georgia,serif; background:#F8F7FA; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .card { background:#fff; border-radius:20px; padding:40px 32px; text-align:center; max-width:360px; width:100%; box-shadow:0 4px 24px rgba(80,30,120,0.1); }
    .check { width:56px; height:56px; border-radius:50%; background:#EAF6EF; display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px; }
    .check svg { width:28px; height:28px; }
    h1 { font-size:22px; color:#2D7D4F; margin-bottom:4px; }
    p { font-size:15px; color:#555; margin-bottom:24px; }
    a { display:block; background:linear-gradient(135deg, #A040E0, #8B2FC9, #7025A8); color:#fff; text-decoration:none; padding:14px 24px; border-radius:10px; font-size:16px; font-weight:700; font-family:Georgia,serif; }
    .sub { font-size:12px; color:#888; margin-top:12px; }
  </style>
  <script>
    // Save payment status for the app to detect
    try { localStorage.setItem("km-square-paid", Date.now().toString()); } catch(e) {}
  </script>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2D7D4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Payment Complete</h1>
    <p>Return to KM Gems to finish the order</p>
    <a href="/">Open KM Gems</a>
    <div class="sub">You can close this tab</div>
  </div>
</body>
</html>
